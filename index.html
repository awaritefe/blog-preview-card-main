<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Blog preview card</title>

</head>

<body>
  <main>
    <div class="card">
      <picture class="card-image">
        <img class="card-image-itself" src="./assets/images/illustration-article.svg" alt="illustration art">
      </picture>
      <div class="card-content">
        <span>Learning</span>

        <p class="card-date">Published 21 Dec 2023</p>

        <h1>HTML & CSS foundations</h1>

        <p class="card-copy">These languages are the backbone of every website, defining structure, content, and
          presentation.</p>

      </div>
      <div class="card-footer">
        <img src="./assets/images/image-avatar.webp" alt="illustration art" width="32" height="32">
        <p>Greg Hooper</p>
      </div>
    </div>
  </main>
  <footer role="footer-info" class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/awaritefe">Daniel Tefe</a>.
  </footer>
</body>

</html>
